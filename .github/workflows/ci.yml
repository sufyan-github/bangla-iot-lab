# Runs on GitHub's hosted Ubuntu runners for every pull request and every push to main.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: banglalab
          POSTGRES_PASSWORD: banglalab_dev
          POSTGRES_DB: banglalab_dev
        ports: ['55440:5432']
        options: >-
          --health-cmd "pg_isready -U banglalab" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr bubblewrap
      # For ESP32 sketches, which are built as WebAssembly and made pausable.
      - run: sudo apt-get install -y clang-18 lld-18 wasi-libc libc++-18-dev-wasm32 libc++abi-18-dev-wasm32 libclang-rt-18-dev-wasm32 binaryen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @banglalab/compile-worker core:fetch
      - run: pnpm --filter @banglalab/board-emulators pico:fetch
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      # The real ESP32 toolchain, for building firmware for the chip emulator: about 1.6 GB, so kept between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: esp32-toolchain-espressif32-8.0.0
      - run: sh apps/compile-worker/scripts/fetch-esp32-toolchain.sh
      # The ESP32 emulator the lab can run firmware in: built from its pinned source (needs Rust).
      - run: sh third_party/esp32sim/build.sh .cache/esp32sim
      - run: pnpm test:integration
      - run: pnpm --filter @banglalab/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
