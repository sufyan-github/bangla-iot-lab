<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Output pin voltage against load current</title>
<desc>Driving HIGH, the pin falls from 3.3 V to 2.64 V at 20 mA at the default drive strength and at 40 mA at the highest. Driving LOW, it rises to 0.495 V at 14 mA at the default strength and at 28 mA at the highest.</desc>
