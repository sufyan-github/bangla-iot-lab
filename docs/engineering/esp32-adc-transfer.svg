<text x="64" y="230.69" font-size="11" text-anchor="end" fill="#52514e">2000</text>
<line x1="72" x2="732" y1="149.03" y2="149.03" stroke="#e3e2dd"/>
<text x="64" y="153.03" font-size="11" text-anchor="end" fill="#52514e">3000</text>
<line x1="72" x2="732" y1="64" y2="64" stroke="#e3e2dd"/>
<text x="64" y="68" font-size="11" text-anchor="end" fill="#52514e">4095</text>
<line x1="72" x2="72" y1="382" y2="387" stroke="#9b9a94"/>
<text x="72" y="401" font-size="11" text-anchor="middle" fill="#52514e">0</text>
<line x1="172" x2="172" y1="382" y2="387" stroke="#9b9a94"/>
<text x="172" y="401" font-size="11" text-anchor="middle" fill="#52514e">0.5</text>
<line x1="272" x2="272" y1="382" y2="387" stroke="#9b9a94"/>
<text x="272" y="401" font-size="11" text-anchor="middle" fill="#52514e">1</text>
<line x1="372" x2="372" y1="382" y2="387" stroke="#9b9a94"/>
<text x="372" y="401" font-size="11" text-anchor="middle" fill="#52514e">1.5</text>
<line x1="472" x2="472" y1="382" y2="387" stroke="#9b9a94"/>
<text x="472" y="401" font-size="11" text-anchor="middle" fill="#52514e">2</text>
<line x1="572" x2="572" y1="382" y2="387" stroke="#9b9a94"/>
<text x="572" y="401" font-size="11" text-anchor="middle" fill="#52514e">2.5</text>
<line x1="672" x2="672" y1="382" y2="387" stroke="#9b9a94"/>
<text x="672" y="401" font-size="11" text-anchor="middle" fill="#52514e">3</text>
<line x1="732" x2="732" y1="382" y2="387" stroke="#9b9a94"/>
<text x="732" y="401" font-size="11" text-anchor="middle" fill="#52514e">3.3</text>
<line x1="72" x2="732" y1="382" y2="382" stroke="#9b9a94"/>
<text x="402" y="426" font-size="12" text-anchor="middle" fill="#52514e">Input voltage (V)</text>
