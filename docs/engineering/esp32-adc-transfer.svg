<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>ADC transfer curve at 11 dB (the analogRead default)</title>
<desc>The modelled count is 0 below 0.142 V, runs in a straight line to about 2.46 V, parallel to a perfect converter and about 176 counts below it, then bends upward and reaches 4095 at 3.134 V.</desc>
<rect width="760" height="440" fill="#fcfcfb"/>
<text x="72" y="26" font-size="16" font-weight="600" fill="#0b0b0b">ADC transfer curve at 11 dB (the analogRead default)</text>
<text x="72" y="46" font-size="12" fill="#52514e">Count returned for an input voltage: a perfect 0 to 3.3 V converter, and the model.</text>
<line x1="72" x2="732" y1="382" y2="382" stroke="#e3e2dd"/>
<text x="64" y="386" font-size="11" text-anchor="end" fill="#52514e">0</text>
